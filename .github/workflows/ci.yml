name: CI

# Correctness only. Performance is never measured in CI (see bench.yml).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    timeout-minutes: 45
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is x86-64; macos-latest is arm64 (Apple silicon), the
        # first place NEON code actually executes. Keep both.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Model cache. The key is the manifest hash, so bumping a pinned
      # revision refetches. Only the small CI set (stories260K,
      # stories15M-q8_0, SmolLM2-135M, Qwen3-0.6B-Q8_0). macOS runners have
      # 3 cores and 7 GB RAM, so never add 1B-class models here. These steps
      # come after the cheap checks so a lint or test failure on a cache miss
      # does not first download ~810 MB.
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ runner.os }}-${{ hashFiles('crates/xtask/models.toml') }}

      - name: Fetch models
        run: cargo xtask models fetch --set ci

      - name: Model tests
        # CI does not build llama.cpp, so it has no reference dumps for the bench
        # test; run tools/llama.cpp/run.sh and that test locally.
        # The 3000 header mutations are the slow test. Release keeps them under
        # the minute on the macOS runner. The other ignored tests stay debug.
        run: |
          cargo test --workspace -- --ignored --skip llama_cpp_logits_have_zero_kld_with_themselves_and_not_with_a_perturbed_copy --skip seeded_header_mutations_do_not_panic --exact
          cargo test -p gguf --test conformance --release -- --ignored --exact seeded_header_mutations_do_not_panic
