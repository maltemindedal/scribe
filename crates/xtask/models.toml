# Pinned test models. `cargo xtask models fetch` downloads each file from
# https://huggingface.co/<repo>/resolve/<revision>/<file> into models/ and
# verifies size and SHA-256. Values come from the Hugging Face API
# (`/api/models/<repo>?blobs=true`): `revision` is the repo commit, `sha256`
# the LFS object hash. Editing this file changes the CI model cache key.
#
# set = "ci"  : fetched by `--set ci` and `--set all`
# set = "all" : fetched by `--set all` only
# dest        : file name under models/

[[model]]
name = "stories260K"
repo = "ggml-org/tiny-llamas"
file = "stories260K.gguf"
dest = "stories260K.gguf"
revision = "99dd1a73db5a37100bd4ae633f4cfce6560e1567"
sha256 = "047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b"
size = 1185376
license = "not declared"
role = "GQA head-mapping, context overflow"
set = "ci"

