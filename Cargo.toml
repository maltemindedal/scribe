[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["research", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/maltemindedal/scribe"
publish = false

# `kernels` and `mapfile` are allowed `unsafe`. They copy these two tables with
# `unsafe_code` left out, because Cargo cannot override one key of an
# inherited table. `crates/xtask/tests/lint_policy.rs` checks every member.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1

# Release speed for the 3000 header mutations, with the overflow panics
# and debug_assert! that release turns off.
[profile.mutation]
inherits = "release"
overflow-checks = true
debug-assertions = true

# The xtask hashes multi-gigabyte files; unoptimised SHA-256 takes minutes.
[profile.dev.package.xtask]
opt-level = 3
