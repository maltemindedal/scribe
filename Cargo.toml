[workspace]
resolver = "3"
members = ["crates/*"]
# research/ holds imported, unmodified research artifacts (see research/README.md).
# They are standalone packages and must not join the workspace or its CI checks.
exclude = ["research"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/maltemindedal/scribe"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1

# The xtask hashes multi-gigabyte files; unoptimised SHA-256 takes minutes.
[profile.dev.package.xtask]
opt-level = 3
