[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["research", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/maltemindedal/scribe"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1

# Release speed for the 3000 header mutations, with the overflow panics
# and debug_assert! that release turns off.
[profile.mutation]
inherits = "release"
overflow-checks = true
debug-assertions = true

# The xtask hashes multi-gigabyte files; unoptimised SHA-256 takes minutes.
[profile.dev.package.xtask]
opt-level = 3
